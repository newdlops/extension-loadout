<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a5c"/>
      <stop offset="1" stop-color="#3b1f6b"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0a8"/>
      <stop offset="1" stop-color="#18a5d6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- 장착된 칸 -->
  <g filter="url(#glow)">
    <rect x="44" y="44" width="76" height="76" rx="18" fill="url(#slot)"/>
    <rect x="136" y="136" width="76" height="76" rx="18" fill="url(#slot)"/>
  </g>
  <path d="M63 83 l14 14 l26 -28" fill="none" stroke="#0e1838" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M155 175 l14 14 l26 -28" fill="none" stroke="#0e1838" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 비어 있는 칸 -->
  <rect x="139" y="47" width="70" height="70" rx="16" fill="none" stroke="#8f9bd6" stroke-opacity="0.75" stroke-width="6" stroke-dasharray="12 9"/>
  <rect x="47" y="139" width="70" height="70" rx="16" fill="none" stroke="#8f9bd6" stroke-opacity="0.75" stroke-width="6" stroke-dasharray="12 9"/>
</svg>
